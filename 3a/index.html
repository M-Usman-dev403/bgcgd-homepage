        </div>

// ---- minimal template expander: {{ path }}, <sc-for>, <sc-if> ----
const look = (path, scope) => {
  if (path === 'true') return true;
  if (path === 'false') return false;
  let v = scope;
  for (const part of path.split('.')) {
    if (v == null) return undefined;
    v = v[part];
  }
  return v === undefined ? (DATA[path] !== undefined ? DATA[path] : undefined) : v;
};
const resolve = (path, scope) => {
  const local = look(path, scope);
  if (local !== undefined) return local;
  return look(path, DATA);
};
const fill = (text, scope) => text.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => {
  const v = resolve(p, scope);
  return v === undefined || v === null ? '' : String(v);
});

function selfAttrs(el, scope) {
  if (el.nodeType !== 1) return;
  for (const attr of Array.from(el.attributes)) {
    if (attr.value.indexOf('{{') !== -1) el.setAttribute(attr.name, fill(attr.value, scope));
  }
  const hov = el.getAttribute('style-hover');
  if (hov) {
    el.removeAttribute('style-hover');
    const base = el.getAttribute('style') || '';
    el.addEventListener('mouseenter', () => { el.setAttribute('style', base + ';' + hov); });
    el.addEventListener('mouseleave', () => { el.setAttribute('style', base); });
  }
}

function expand(node, scope) {
  selfAttrs(node, scope);
  const kids = Array.from(node.childNodes);
  for (const child of kids) {
    if (child.nodeType === 3) {
      if (child.nodeValue.indexOf('{{') !== -1) child.nodeValue = fill(child.nodeValue, scope);
      continue;
    }
    if (child.nodeType !== 1) continue;
    const tag = child.tagName.toLowerCase();

    if (tag === 'sc-for') {
      const listPath = (child.getAttribute('list') || '').replace(/[{}\s]/g, '');
      const as = child.getAttribute('as') || 'item';
      const list = resolve(listPath, scope) || [];
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        for (const proto of Array.from(child.children)) {
          const clone = proto.cloneNode(true);
          const inner = Object.create(scope);
          inner[as] = item;
          inner.$index = i;
          expand(clone, inner);
          frag.appendChild(clone);
        }
      });
      child.replaceWith(frag);
      continue;
    }

    if (tag === 'sc-if') {
      const valPath = (child.getAttribute('value') || '').replace(/[{}\s]/g, '');
      if (resolve(valPath, scope)) {
        const frag = document.createDocumentFragment();
        for (const proto of Array.from(child.childNodes)) {
          const clone = proto.cloneNode(true);
          if (clone.nodeType === 1) expand(clone, scope); 
          else if (clone.nodeType === 3 && clone.nodeValue.indexOf('{{') !== -1) clone.nodeValue = fill(clone.nodeValue, scope);
          frag.appendChild(clone);
        }
        child.replaceWith(frag);
      } else {
        child.remove();
      }
      continue;
    }

    expand(child, scope);
  }
}

const tpl = document.getElementById('tpl');
const root = document.createElement('div');
root.innerHTML = tpl.innerHTML;
expand(root, DATA);
document.getElementById('app').appendChild(root);

// values are resolved now, so promote the deferred sources
for (const img of root.querySelectorAll('img[data-src]')) {
  const v = img.getAttribute('data-src');
  img.removeAttribute('data-src');
  if (v) img.src = v;
}

// ---- behaviour, reused from the design ----
const App = {
  _vals: DATA,

  motion() {
    const pages = ['#p3a', '#p3b'].map(s => document.querySelector(s)).filter(Boolean);
    if (!pages.length) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- primary-button polish: sheen + magnetic pull ----
    for (const page of pages) {
      for (const el of page.querySelectorAll('a, button')) {
        const bg = getComputedStyle(el).backgroundColor;
        const solid = bg === 'rgb(18, 115, 230)' || bg === 'rgb(255, 255, 255)' || bg === 'rgb(10, 26, 47)';
        if (!solid || el.querySelector('.om-sh')) continue;
        const light = bg === 'rgb(255, 255, 255)';
        el.classList.add('om-sheen');
        const sh = document.createElement('span');
        sh.className = 'om-sh';
        sh.style.background = 'linear-gradient(90deg, transparent, ' + (light ? 'rgba(10,26,47,.10)' : 'rgba(255,255,255,.32)') + ', transparent)';
        el.appendChild(sh);
        if (reduce) continue;
        el.style.willChange = 'transform';
        el.addEventListener('mousemove', (e) => {
          const r = el.getBoundingClientRect();
          const x = (e.clientX - r.left - r.width / 2) / r.width;
          const y = (e.clientY - r.top - r.height / 2) / r.height;
          el.style.transform = 'translate3d(' + (x * 7).toFixed(2) + 'px,' + (y * 5).toFixed(2) + 'px,0)';
        });
        el.addEventListener('mouseleave', () => { el.style.transform = ''; });
      }
    }

    // The runtime does not reflect the `muted` attribute onto the element, so
    // autoplay is blocked until the property itself is set.
    for (const v of document.querySelectorAll('video')) {
      v.muted = true;
      v.defaultMuted = true;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }

    // ---- hero film controls (one per page) ----
    const PAUSE_I = '<svg width="10" height="10" viewBox="0 0 12 12" fill="#fff"><rect x="2" y="1.5" width="2.6" height="9" rx="1"/><rect x="7.4" y="1.5" width="2.6" height="9" rx="1"/></svg>';
    const PLAY_I = '<svg width="10" height="10" viewBox="0 0 12 12" fill="#fff"><path d="M3 1.6 10.2 6 3 10.4Z"/></svg>';
    for (const vid of document.querySelectorAll('[data-hero-video]')) {
      const shell = vid.parentElement;
      const vbtn = shell && shell.querySelector('[data-video-toggle]');
      if (!vbtn || vbtn._omWired) continue;
      vbtn._omWired = true;
      const icon = vbtn.querySelector('[data-video-icon]');
      const label = vbtn.querySelector('[data-video-label]');
      const sync = () => {
        const playing = !vid.paused;
        if (icon) icon.innerHTML = playing ? PAUSE_I : PLAY_I;
        if (label) label.textContent = playing ? 'Pause the film' : 'Play the film';
        vbtn.setAttribute('aria-label', playing ? 'Pause the film' : 'Play the film');
      };
      vbtn.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
      vid.addEventListener('play', sync);
      vid.addEventListener('pause', sync);
      const kick = vid.play();
      if (kick && kick.catch) kick.catch(() => {});
      sync();
    }

    // ---- finder: cards stack over one another as the list scrolls ----
    for (const finder of document.querySelectorAll('[data-find]')) {
      finder.querySelectorAll('[data-club]').forEach((card, i) => {
        card.style.position = 'sticky';
        card.style.top = (24 + i * 14) + 'px';
        card.style.zIndex = String(i + 1);
      });
    }

    this.buildMap();
    // ---- club finder: filter by ZIP or city, no re-render ----
    for (const panel of document.querySelectorAll('[data-find]')) {
      const input = panel.querySelector('[data-zip]');
      const cards = Array.from(panel.querySelectorAll('[data-club]'));
      const pins = Array.from(panel.querySelectorAll('[data-pin], [data-chip]'));
      const count = panel.querySelector('[data-club-count]');
      const empty = panel.querySelector('[data-club-empty]');
      if (!input || !cards.length) continue;

      const apply = (q) => {
        const t = (q || '').trim().toLowerCase();
        let shown = 0;
        for (const card of cards) {
          const hay = (card.getAttribute('data-z') + ' ' + card.getAttribute('data-n') + ' ' + card.textContent).toLowerCase();
          const hit = !t || hay.includes(t);
          card.style.display = hit ? '' : 'none';
          if (hit) shown++;
        }
        for (const pin of pins) {
          const hay = (pin.getAttribute('data-z') + ' ' + pin.getAttribute('data-n')).toLowerCase();
          const hit = !t || hay.includes(t);
          pin.style.opacity = hit ? '1' : '.2';
          pin.style.zIndex = hit ? '2' : '1';
        }
        // dim this panel's own markers, and frame whatever is left
        const reg = panel._omMarkers;
        if (reg) {
          const live = [];
          for (const z in reg) {
            const m = reg[z];
            const c = (this._vals.clubs || []).find((x) => x.z === z);
            const hit = !t || (z + ' ' + (c ? c.n : '')).toLowerCase().includes(t);
            const el = m.getElement();
            if (el) el.style.opacity = hit ? '1' : '.25';
            if (hit) live.push(m.getLatLng());
          }
          if (panel._omMap && live.length) {
            if (live.length === 1) panel._omMap.setView(live[0], 13, { animate: true });
            else panel._omMap.flyToBounds(live, { padding: [58, 58], duration: .6 });
          }
        }
        if (count) count.textContent = shown === 1 ? '1 club matches' : shown + (t ? ' clubs match' : ' clubs across metro Detroit');
        if (empty) empty.style.display = shown ? 'none' : 'block';
      };

      panel.querySelector('[data-zip-go]').addEventListener('click', () => apply(input.value));
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); apply(input.value); } });
      input.addEventListener('input', () => { if (!input.value.trim()) apply(''); });
      for (const r of panel.querySelectorAll('[data-zip-reset]')) {
        r.addEventListener('click', (e) => { e.preventDefault(); input.value = ''; apply(''); });
      }
      for (const pin of pins) {
        pin.addEventListener('click', (e) => { e.preventDefault(); input.value = pin.getAttribute('data-z'); apply(input.value); });
      }
      // hovering a club card lifts its marker on this panel's map
      for (const card of cards) {
        const look = () => (panel._omMarkers || {})[card.getAttribute('data-z')];
        card.addEventListener('mouseenter', () => {
          const m = look(); const el = m && m.getElement();
          if (el && el.style.transform.indexOf('scale(1.14)') === -1) {
            el.style.zIndex = '900';
            el.style.transform += ' scale(1.14)';
          }
        });
        card.addEventListener('mouseleave', () => {
          const m = look(); const el = m && m.getElement();
          if (el) { el.style.zIndex = ''; el.style.transform = el.style.transform.replace(' scale(1.14)', ''); }
        });
      }
    }

    if (reduce) return;

    // ---- cursor-follow glow in each hero ----
    for (const hero of document.querySelectorAll('[data-hero]')) {
      const glow = hero.querySelector('[data-glow]');
      if (!glow) continue;
      hero.addEventListener('mousemove', (e) => {
        const r = hero.getBoundingClientRect();
        glow.style.transform = 'translate3d(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px,0)';
        glow.style.opacity = '1';
      });
      hero.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
    }

    // ---- scroll reveals, staggered ----
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        e.target.classList.add('om-in');
        io.unobserve(e.target);
      }
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });

    const mark = (el, mod, delay) => {
      if (!el || el.classList.contains('om-rv')) return;
      // a transformed ancestor becomes the containing block and kills sticky,
      // so bands containing sticky children are never revealed
      if (el.matches('[data-find]') || el.querySelector('[data-find], [data-map], [data-club]')) return;
      el.classList.add('om-rv');
      if (mod) el.classList.add(mod);
      if (delay) el.style.transitionDelay = delay + 'ms';
      io.observe(el);
    };

    for (const page of pages) {
      const bands = Array.from(page.children);
      for (const band of bands) {
        if (band.querySelector('nav')) continue;
        const hero = band.matches('[data-hero]');
        if (hero) {
          const col = band.querySelector('div');
          if (col) Array.from(col.children).forEach((c, i) => mark(c, 'om-l', i * 110));
          continue;
        }
        const isGrid = (el) => el && el.style && (el.style.gridTemplateColumns || '').includes('repeat');
        let grid = isGrid(band) ? band : null;
        if (!grid) for (const el of band.querySelectorAll('*')) { if (isGrid(el)) { grid = el; break; } }
        if (grid === band) {
          Array.from(band.children).forEach((c, i) => mark(c, 'om-s', i * 85));
        } else {
          mark(band);
          if (grid) Array.from(grid.children).forEach((c, i) => mark(c, 'om-s', 90 + i * 85));
        }
      }
    }

    // ---- statistics count-up ----
    const cio = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        cio.unobserve(e.target);
        this.countUp(e.target);
      }
    }, { threshold: 0.5 });
    for (const el of document.querySelectorAll('[data-count]')) cio.observe(el);

    // ---- hero media parallax ----
    const media = [];
    for (const hero of document.querySelectorAll('[data-hero]')) {
      const m = hero.querySelector('video') || hero.querySelector('div:last-child');
      if (m) { m.style.willChange = 'transform'; media.push([hero, m]); }
    }
    if (media.length) {
      let queued = false;
      const step = () => {
        queued = false;
        for (const [hero, m] of media) {
          const r = hero.getBoundingClientRect();
          if (r.bottom < -200 || r.top > innerHeight + 200) continue;
          const p = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
          m.style.transform = 'translate3d(0,' + (p * -22).toFixed(2) + 'px,0) scale(1.06)';
        }
      };
      addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(step); } }, { passive: true });
      step();
    }
  },

  buildMap() {
    const mounts = document.querySelectorAll('[data-leaflet]');
    if (!mounts.length) return;
    if (!window.L) { setTimeout(() => this.buildMap(), 200); return; }

    const clubs = (this._vals && this._vals.clubs) || [];
    if (!clubs.length) return;

    for (const mount of mounts) {
      if (mount._omMap) continue;

      const map = L.map(mount, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
      mount._omMap = map;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const markers = {};
      const points = [];
      for (const c of clubs) {
        if (!isFinite(c.lat) || !isFinite(c.lng)) continue;
        const icon = L.divIcon({
          className: '',
          iconSize: [26, 52],
          iconAnchor: [13, 52],
          html: '<span class="om-mk">'
            + '<span class="om-mk-lbl">' + c.z + '</span>'
            + '<svg width="26" height="34" viewBox="0 0 26 34" fill="none" style="filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));"><path d="M13 33S24.5 20.6 24.5 13A11.5 11.5 0 1 0 1.5 13C1.5 20.6 13 33 13 33Z" fill="#1273E6" stroke="#fff" stroke-width="2"/><circle cx="13" cy="13" r="4.2" fill="#fff"/></svg>'
            + '</span>'
        });
        const m = L.marker([c.lat, c.lng], { icon: icon, title: c.n }).addTo(map);
        m.bindPopup('<strong>' + c.n + '</strong><br>' + c.a + '<br>' + c.hrs);
        markers[c.z] = m;
        points.push([c.lat, c.lng]);
      }
      if (points.length) map.fitBounds(points, { padding: [58, 58] });

      // each finder owns its own map and marker registry
      const panel = mount.closest('[data-find]');
      if (panel) { panel._omMap = map; panel._omMarkers = markers; }

      if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(mount);
    }
  },

  countUp(el) {
    const raw = el.getAttribute('data-count') || el.textContent;
    const m = raw.match(/([^\d]*)([\d,.]+)(.*)/);
    if (!m) return;
    const pre = m[1], post = m[3];
    const target = Number(m[2].replace(/,/g, ''));
    if (!isFinite(target)) return;
    const dur = 1500, start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + Math.round(target * e).toLocaleString('en-US') + post;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

};
App.buildMap();
App.motion();

  var b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', 'Back to top');
  b.style.cssText = 'position:fixed; right:22px; bottom:22px; z-index:9999; width:52px; height:52px; padding:0; border:0; border-radius:50%; background:#12304F; color:#ffffff; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(0,0,0,.30); opacity:0; visibility:hidden; transform:translateY(12px); transition:opacity .25s ease, transform .25s ease, visibility .25s;';
  b.innerHTML = '<svg width="52" height="52" viewBox="0 0 52 52" style="position:absolute; inset:0; transform:rotate(-90deg);" aria-hidden="true"><circle cx="26" cy="26" r="23.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"></circle><circle data-prog cx="26" cy="26" r="23.5" fill="none" stroke="#1273E6" stroke-width="3" stroke-linecap="round" stroke-dasharray="147.65" stroke-dashoffset="147.65"></circle></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:relative;" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>';
  document.body.appendChild(b);
  var prog = b.querySelector('[data-prog]');
  function upd() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || window.pageYOffset || 0;
    var p = h > 0 ? Math.min(1, Math.max(0, y / h)) : 0;
    prog.setAttribute('stroke-dashoffset', String(LEN * (1 - p)));
    var on = y > 400;
    b.style.opacity = on ? '1' : '0';
    b.style.visibility = on ? 'visible' : 'hidden';
    b.style.transform = on ? 'none' : 'translateY(12px)';
  }
  b.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  window.addEventListener('scroll', upd, { passive: true });
  window.addEventListener('resize', upd);
  setTimeout(upd, 300);
  upd();
})();
</script>

  var burger = document.createElement('button');
  burger.type = 'button';
  burger.className = 'om-burger';
  burger.setAttribute('aria-label', 'Open menu');
  burger.setAttribute('aria-expanded', 'false');
  burger.innerHTML = '<span></span><span></span><span></span>';

  var panel = document.createElement('div');
  panel.className = 'om-menu';
  var navClone = nav.cloneNode(true);
  navClone.classList.remove('om-navrow');
  panel.appendChild(navClone);
  if (ctas) {
    var ctaClone = ctas.cloneNode(true);
    ctaClone.classList.remove('om-ctarow');
    ctaClone.removeAttribute('style');
    ctaClone.className = 'om-menu-cta';
    panel.appendChild(ctaClone);
  }
  header.appendChild(burger);
  header.appendChild(panel);

  function set(open) {
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    panel.classList.toggle('om-open', open);
  }
  burger.addEventListener('click', function () {
    set(burger.getAttribute('aria-expanded') !== 'true');
  });
  panel.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
  window.addEventListener('resize', function () { if (window.innerWidth > 1024) set(false); });
})();
</script>
</body>
</html>
